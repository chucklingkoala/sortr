[package]
name = "sortr"
description = "Moves files into the right folders by reading their names."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "Sortr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sortr-core = { path = "../crates/sortr-core" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same version Tauri uses, so it isn't compiled twice.
windows = { version = "0.62", features = [
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# `cargo build --release` produces the production exe (assets embedded, no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
