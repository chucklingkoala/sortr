[package]
name = "sortr"
description = "Moves files into the right folders by reading their names."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "Sortr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
# `cargo build --release` produces the production exe (assets embedded, no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
